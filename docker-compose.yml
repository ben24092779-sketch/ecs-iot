services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-u", "${MQTT_USERNAME}", "-P", "${MQTT_PASSWORD}", "-t", "healthcheck", "-m", "ping", "-i", "healthcheck-client"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MQTT_BROKER_HOST: mosquitto
    command: sh -c "python manage.py migrate --noinput && (python manage.py createsuperuser --noinput || true)"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MQTT_BROKER_HOST: ${MQTT_CLOUD_BROKER_HOST}
      MQTT_BROKER_PORT: ${MQTT_CLOUD_BROKER_PORT:-8883}
      MQTT_USERNAME: ${MQTT_CLOUD_USERNAME}
      MQTT_PASSWORD: ${MQTT_CLOUD_PASSWORD}
      MQTT_TLS_ENABLED: ${MQTT_CLOUD_TLS_ENABLED:-true}
      MQTT_CA_CERT: ${MQTT_CLOUD_CA_CERT:-/app/certs/emqxsl-ca.crt}
    volumes:
      - media_data:/app/media
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: rebuild
          path: ./backend/requirements.txt

  mqtt_listener:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MQTT_BROKER_HOST: ${MQTT_CLOUD_BROKER_HOST}
      MQTT_BROKER_PORT: ${MQTT_CLOUD_BROKER_PORT:-8883}
      MQTT_USERNAME: ${MQTT_CLOUD_USERNAME}
      MQTT_PASSWORD: ${MQTT_CLOUD_PASSWORD}
      MQTT_TLS_ENABLED: ${MQTT_CLOUD_TLS_ENABLED:-true}
      MQTT_CA_CERT: ${MQTT_CLOUD_CA_CERT:-/app/certs/emqxsl-ca.crt}
    command: python manage.py run_mqtt_listener
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: rebuild
          path: ./backend/requirements.txt

  plc_gateway:
    profiles: ["plc"]
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      PLC_HOST: ${PLC_HOST:-10.41.32.1}
      PLC_RACK: ${PLC_RACK:-0}
      PLC_SLOT: ${PLC_SLOT:-1}
      PLC_DB_NUMBER: ${PLC_DB_NUMBER:-1}
      PLC_SYNC_INTERVAL: ${PLC_SYNC_INTERVAL:-2}
    command: python manage.py run_plc_gateway
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  simulator:
    build: ./simulator
    restart: unless-stopped
    env_file: .env
    environment:
      MQTT_BROKER_HOST: mosquitto
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  media_data:
